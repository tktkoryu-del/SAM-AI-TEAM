name: SAM Recovery Android CI
on:
  push:
    paths:
      - "projects/sam-recovery/android/**"
      - ".github/workflows/sam-recovery-android-ci.yml"
  pull_request:
    paths:
      - "projects/sam-recovery/android/**"
      - ".github/workflows/sam-recovery-android-ci.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: projects/sam-recovery/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sam-recovery-debug
          path: projects/sam-recovery/android/app/build/outputs/apk/debug/app-debug.apk