name: SAM Recovery iOS CI
on:
  push:
    paths:
      - "projects/sam-recovery/ios/**"
      - ".github/workflows/sam-recovery-ios-ci.yml"
  pull_request:
    paths:
      - "projects/sam-recovery/ios/**"
      - ".github/workflows/sam-recovery-ios-ci.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: projects/sam-recovery/ios
        run: xcodegen generate
      - name: Build iOS Simulator target
        working-directory: projects/sam-recovery/ios
        run: xcodebuild -scheme SAMRecovery -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build