services:
  coordinator:
    build: .
    command: ["python", "coordinator.py"]
    ports: ["8787:8787"]
    environment:
      SAM_BIND_HOST: "0.0.0.0"
      SAM_DOCKER_NETWORK: "1"
      SAM_API_TOKEN: "${SAM_API_TOKEN:?Set SAM_API_TOKEN in .env}"
    depends_on: [ceo, coo, research, strategy, cto, design, video, content, marketing, platforms, finance, quality]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  ceo: &worker
    build: .
    command: ["python", "service.py", "ceo"]
    environment: &worker_env
      SAM_BIND_HOST: "0.0.0.0"
      SAM_LLM_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      SAM_OLLAMA_MODEL: "${SAM_OLLAMA_MODEL:-qwen2.5:3b}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  coo: {<<: *worker, command: ["python", "service.py", "coo"]}
  research: {<<: *worker, command: ["python", "service.py", "research"]}
  strategy: {<<: *worker, command: ["python", "service.py", "strategy"]}
  cto: {<<: *worker, command: ["python", "service.py", "cto"]}
  design: {<<: *worker, command: ["python", "service.py", "design"]}
  video: {<<: *worker, command: ["python", "service.py", "video"]}
  content: {<<: *worker, command: ["python", "service.py", "content"]}
  marketing: {<<: *worker, command: ["python", "service.py", "marketing"]}
  platforms: {<<: *worker, command: ["python", "service.py", "platforms"]}
  finance: {<<: *worker, command: ["python", "service.py", "finance"]}
  quality: {<<: *worker, command: ["python", "service.py", "quality"]}
